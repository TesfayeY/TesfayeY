name: debug-token (temporary)
on:
  push:
    branches: [profile-graphics]
    paths: [.github/workflows/debug-token.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      Q: >-
        fragment RepoNode on Repository {   name   stargazerCount }  fragment RepoStars on User {   repositories(     first: 100     after: $after     ownerAffiliations: $ownerAffiliations     orderBy: { direction: DESC, field: STARGAZERS }   ) {     totalCount     nodes {       ...RepoNode     }     pageInfo {       hasNextPage       endCursor     }   } }  query userInfo(   $login: String!   $after: String   $includeMergedPullRequests: Boolean!   $includeDiscussions: Boolean!   $includeDiscussionsAnswers: Boolean!   $startTime: DateTime = null   $ownerAffiliations: [RepositoryAffiliation]   $includeUserRepositories: Boolean! ) {   user(login: $login) {     name     login     commits: contributionsCollection(from: $startTime) {       totalCommitContributions     }     reviews: contributionsCollection {       totalPullRequestReviewContributions     }     repositoriesContributedTo(       first: 1       contributionTypes: [COMMIT, ISSUE, PULL_REQUEST, REPOSITORY]       includeUserRepositories: $includeUserRepositories     ) {       totalCount     }     pullRequests(first: 1) {       totalCount     }     mergedPullRequests: pullRequests(states: MERGED)       @include(if: $includeMergedPullRequests) {       totalCount     }     openIssues: issues(states: OPEN) {       totalCount     }     closedIssues: issues(states: CLOSED) {       totalCount     }     followers {       totalCount     }     repositoryDiscussions @include(if: $includeDiscussions) {       totalCount     }     repositoryDiscussionComments(onlyAnswers: true)       @include(if: $includeDiscussionsAnswers) {       totalCount     }     contributionsCollection {       contributionYears     }     ...RepoStars   } }  
    steps:
      - run: |
          echo "FULL => $(gh api graphql -f query="$Q" -f login=TesfayeY -F includeMergedPullRequests=false -F includeDiscussions=false -F includeDiscussionsAnswers=false -F includeUserRepositories=false -f 'ownerAffiliations[]=OWNER' 2>&1 | tr -d '\n' | head -c 400)"
          echo "YEARS => $(gh api graphql -f query='{ user(login:"TesfayeY") { contributionsCollection { contributionYears } } }' 2>&1 | tr -d '\n' | head -c 200)"
          echo "STARS => $(gh api graphql -f query='{ user(login:"TesfayeY") { repositories(first:100, ownerAffiliations:[OWNER], orderBy:{direction:DESC, field:STARGAZERS}) { totalCount nodes { name stargazerCount } } } }' 2>&1 | tr -d '\n' | head -c 200)"
